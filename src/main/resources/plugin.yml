main: ${mainClass}
name: ${name}
version: ${version}
description: "Generates time-limited tokens for players to verify account ownership"
api-version: ${minimumMinecraftVersion}
load: POSTWORLD
author: ${developers[0].name}
website: shirecraft.us
prefix: ${name}
libraries:
  - io.jsonwebtoken:jjwt-impl:0.13.0
  - io.jsonwebtoken:jjwt-jackson:0.13.0
commands:
  verify:
    description: Verify your account for use on our website
    usage: /verify